/* VOICE: herramienta de trabajo diaria del equipo comercial de Minexo, directa

   PICTURE: el mapa de Argentina con la cartera y la ruta optimizada de la gira

   LAYOUT: barra lateral fija + área de trabajo con tarjetas, apilado en móvil */
:root{color-scheme:light dark;
--bg:light-dark(#f3f3f3,#15171b);--card:light-dark(#fff,#1e2126);--ink:light-dark(#23262c,#ecedef);--mute:light-dark(#5f6570,#a3a8b1);
--line:light-dark(#dcdcdc,#30343b);--side:#23262c;--side2:#2f333a;--y:#f4d716;--ydk:light-dark(#8a7a00,#f4d716);
--acc:#f4d716;--ok:light-dark(#1d8a4c,#4fd08b);--warn:light-dark(#a65e00,#ffb35c);--bad:light-dark(#c2363f,#ff7a83);--blue:light-dark(#373c44,#ecedef);

:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{background:linear-gradient(180deg,var(--side),var(--side2));color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand b{font:800 24px/1 Montserrat,sans-serif;letter-spacing:.02em}.brand b span{color:var(--y)}.brand small{display:block;opacity:.7;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.logo{display:none}
nav a{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;padding:10px 12px;border-radius:10px;font-weight:600;opacity:.88}
nav a:hover{background:rgba(255,255,255,.12);opacity:1}
nav a.on{background:var(--y);color:#23262c;opacity:1}

.who{margin-top:auto;background:rgba(255,255,255,.1);border-radius:12px;padding:12px;font-size:13px}
.who select{width:100%;margin-top:6px;background:rgba(255,255,255,.15);border:0;border-radius:8px;padding:8px;color:#fff}
.who option{color:#000}
main{padding:22px clamp(14px,3vw,36px) 60px}
.head{background:var(--card);border-radius:16px;padding:18px 22px;margin-bottom:18px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;justify-content:space-between}
.eyebrow{font-size:12px;font-weight:700;color:var(--mute)}

h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:14px 0 8px}
.card{background:var(--card);border-radius:16px;padding:18px;border:1px solid var(--line)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.hero{background:var(--side);border-bottom:5px solid var(--y);color:#fff;border-radius:18px;padding:22px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;margin-bottom:14px}
.hero h2{font-size:clamp(22px,2.6vw,30px);margin:4px 0}.hero p{margin:0;opacity:.85}
.pill3{display:grid;gap:8px}.pill3 button{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.12);border:0;border-radius:12px;padding:10px 14px;color:#fff;cursor:pointer;text-align:left}
.pill3 b{font-size:22px}
.kpi .n{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.kpi .l{font-size:12px;font-weight:700;color:var(--mute)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink)}.btn.p{background:var(--y);color:#23262c;border-color:transparent}.btn.p:hover{filter:brightness(.95)}.btn.lite{background:var(--y);color:#23262c;border:0}
.btn.wa{background:#1fae5b;color:#fff;border-color:transparent}.btn.s{min-height:32px;padding:5px 10px;font-size:13px}
.btn.del{color:var(--bad)}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid #c9b000;outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
input,select,textarea{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:16px;min-height:42px;width:100%}
.bar input,.bar select{width:auto;flex:1 1 160px}
textarea{min-height:76px;resize:vertical}
label{font-size:12px;font-weight:700;color:var(--mute);display:block}label>input,label>select,label>textarea{margin-top:4px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}.form .w{grid-column:1/-1}
table{width:100%;border-collapse:collapse}th{font-size:11.5px;text-align:left;color:var(--mute);font-weight:700;padding:8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}tbody tr{cursor:pointer}tbody tr:hover{background:var(--soft)}
td b{display:block}td small{color:var(--mute)}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--soft);white-space:nowrap;margin:1px}
.t-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}.t-bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.t-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}.t-blue{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.pA{background:#23262c;color:var(--y)}:root[data-theme=dark] .pA{background:var(--y);color:#23262c}.pB{background:color-mix(in srgb,var(--y) 45%,transparent);color:var(--ink)}.pC{background:var(--soft);color:var(--mute)}
.list>div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}.list>div:last-child{border:0}
.muted{color:var(--mute)}.empty{color:var(--mute);padding:18px 0;text-align:center}
.fig{position:relative}.map{width:100%;height:auto;display:block;background:var(--sea);border-radius:12px}
.map .ar{fill:var(--land);stroke:light-dark(#9aa3b5,#4a5672);stroke-width:1.2}.map .nb{fill:light-dark(#e9edf3,#18202f);stroke:light-dark(#c4cad6,#2a3347);stroke-width:.8}
.map circle{cursor:pointer;stroke:#fff;stroke-width:1.5}.map text{font:600 13px Figtree,system-ui,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px}

.pop.below{transform:translate(-50%,14px)}.pop h4{margin:0 26px 4px 0;font:700 15px/1.25 Montserrat,sans-serif}.pop .x{position:absolute;top:6px;right:6px;border:0;background:none;font-size:18px;cursor:pointer;color:var(--mute);min-height:0}

.day{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;background:var(--card)}
.day h3{margin:0 0 4px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pick{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:12px}

.pick input{width:18px;height:18px;min-height:0;margin-top:2px;flex:none}
.chk{display:flex;gap:14px;flex-wrap:wrap}.chk label{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:14px;font-weight:500}.chk input{width:18px;min-height:0;height:18px}

.scroll{overflow-x:auto}
.mtop{display:none}

const K=Math.cos(38*Math.PI/180),PX=l=>(l+75)*K*40,PY=l=>(-21.5-l)*40;
const hav=(a,b)=>{const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dg=(b.lng-a.lng)*r,x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
const road=(a,b)=>hav(a,b)*1.3;
function optimize(orig,pts,back){
  if(!pts.length)return[];let rest=pts.slice(),seq=[],cur=orig;
  while(rest.length){let bi=0,bd=1e9;rest.forEach((p,i)=>{const d=road(cur,p);if(d<bd){bd=d;bi=i}});cur=rest.splice(bi,1)[0];seq.push(cur)}
  const L=s=>{let t=road(orig,s[0]);for(let i=1;i<s.length;i++)t+=road(s[i-1],s[i]);return t+(back?road(s[s.length-1],orig):0)};
  let best=L(seq),imp=true,it=0;
  while(imp&&it++<200){imp=false;for(let i=0;i<seq.length-1;i++)for(let j=i+1;j<seq.length;j++){const s2=seq.slice(0,i).concat(seq.slice(i,j+1).reverse(),seq.slice(j+1));const l=L(s2);if(l<best-0.01){best=l;seq=s2;imp=true}}}
  return seq}
function splitDays(orig,seq,perDay,kmDay,start,skipWe){
  const days=[];let cur=null,date=start,prev=orig;
  const nextDate=d=>{let x=d;do{x=addDays(x,1)}while(skipWe&&([0,6].includes(new Date(x+'T12:00:00').getDay())||esNoHabil(x)));return x};
  if(skipWe)while([0,6].includes(new Date(date+'T12:00:00').getDay())||esNoHabil(date))date=addDays(date,1);
  for(const p of seq){const leg=road(prev,p);
    if(!cur||cur.stops.length>=perDay||(cur.stops.length&&cur.kmz+leg>kmDay)){if(cur){date=nextDate(date)}cur={fecha:date,stops:[],km:0,kmz:0};days.push(cur)}
    cur.stops.push({id:p.id,km:Math.round(leg)});cur.km+=leg;if(days.length>1||cur.stops.length>1)cur.kmz+=leg;prev=p}
  days.forEach(d=>delete d.kmz);
  days.forEach(d=>d.km=Math.round(d.km));return days}
const gmaps=(from,stops,endAt)=>{const ll=p=>p.lat+','+p.lng;const dest=endAt||stops[stops.length-1];const wp=(endAt?stops:stops.slice(0,-1)).map(ll).join('|');
  return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&origin='+ll(from)+'&destination='+ll(dest)+(wp?'&waypoints='+encodeURIComponent(wp):'')};

function waNum(raw){let d=String(raw||'').replace(/\D/g,'');if(!d)return'';if(d.startsWith('549')&&d.length===13)return d;if(d.startsWith('54'))d=d.slice(2);if(d.length===11&&d[0]==='9')d=d.slice(1);d=d.replace(/^0+/,'');
  if(d.length===12){for(const k of[2,3,4])if(d.slice(k,k+2)==='15'){d=d.slice(0,k)+d.slice(k+2);break}}return d.length===10?'549'+d:''}

const PF=['#f6f3ea','#f1f2e6','#f5efe6','#eef1ea','#f3eee8','#f0efe4'];

    L.geoJSON(G.paises,{renderer:RB,interactive:false,style:{color:'#c3c8cf',weight:.8,fillColor:'#e7e6e1',fillOpacity:1}}).addTo(m);
    L.geoJSON(G.prov,{renderer:RB,interactive:false,style:f=>({color:'#8f969f',weight:1.3,dashArray:'5 3',fillColor:PF[(f.properties.name||'').length%PF.length],fillOpacity:1})}).addTo(m);
    const dep=L.geoJSON(G.dep,{renderer:RB,interactive:false,style:{color:'#b9bdc4',weight:.7,fill:false}});
    const big=L.geoJSON({type:'FeatureCollection',features:G.rut.features.filter(f=>f.properties.type==='Major Highway')},{renderer:RB,interactive:false,style:{color:'#f2b93b',weight:2.6}});
    const sm=L.geoJSON({type:'FeatureCollection',features:G.rut.features.filter(f=>f.properties.type!=='Major Highway')},{renderer:RB,interactive:false,style:{color:'#e2c27a',weight:1.3}});
    const pl=L.layerGroup().addTo(m);G.prov.features.forEach(f=>{const b=L.geoJSON(f).getBounds();f._c=b.getCenter();f._a=Math.abs((b.getNorth()-b.getSouth())*(b.getEast()-b.getWest()));f._n=f.properties.name==='Ciudad de Buenos Aires'?'CABA':f.properties.name});const PV=G.prov.features.slice().sort((a,b)=>b._a-a._a);
    const cg=L.layerGroup().addTo(m);
    const tog=(l,on)=>on?(m.hasLayer(l)||l.addTo(m)):(m.hasLayer(l)&&m.removeLayer(l));
    const upd=()=>{const z=m.getZoom(),bb=m.getBounds().pad(.2);tog(dep,z>=6);tog(sm,z>=6);tog(big,z>=4);
      const min=z<5?1000000:z<6?150000:z<7?40000:z<8?12000:z<9?4000:0;cg.clearLayers();let n=0;const boxes=[];
      const hit=(x,y,w,h)=>boxes.some(b=>x<b[0]+b[2]&&x+w>b[0]&&y<b[1]+b[3]&&y+h>b[1]);
      pl.clearLayers();if(z<7.5)for(const f of PV){const p=m.latLngToContainerPoint(f._c),w=f._n.length*9+6;if(hit(p.x-w/2,p.y-8,w,16))continue;boxes.push([p.x-w/2,p.y-8,w,16]);pl.addLayer(L.marker(f._c,{pane:'lbl',interactive:false,icon:L.divIcon({className:'plbl',html:esc(f._n),iconSize:null})}))}
      for(const c of G.cities){if(c.p<min)break;if(!bb.contains([c.lat,c.lng]))continue;const p=m.latLngToContainerPoint([c.lat,c.lng]),w=c.n.length*7+12;if(hit(p.x-4,p.y-9,w,16))continue;boxes.push([p.x-4,p.y-9,w,16]);if(++n>220)break;
        cg.addLayer(L.marker([c.lat,c.lng],{pane:'lbl',interactive:false,icon:L.divIcon({className:'clbl'+(c.p>=(z<7?300000:60000)?' big':''),html:'<i></i>'+esc(c.n),iconSize:null})}))}};
    m.on('zoomend moveend',upd);upd()}).catch(()=>{el.insertAdjacentHTML('beforeend','<div style="position:absolute;z-index:999;left:10px;bottom:10px;background:#fff;padding:6px 10px;border-radius:8px;font-size:13px">No se pudieron cargar las capas del mapa.</div>')});

const dIso=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
const dOf=s=>new Date(s+'T12:00:00');
const monday=s=>{const x=dOf(s);x.setDate(x.getDate()-((x.getDay()+6)%7));return dIso(x)};
function calEvents(){const by={};const add=(d,e)=>{(by[d]||(by[d]=[])).push(e)};const fv=ui.calVend||'';
  Object.values(S.V).forEach(v=>{const d=v.fechaReal||v.fechaPlan;if(!d||(fv&&v.vendedor!==fv))return;const c=S.C[v.clienteId]||{};
    add(d,{k:'v',id:v.id,t:c.nombre||'(sin cliente)',sub:[v.motivo,v.vendedor].filter(Boolean).join(' · '),cls:v.estado==='Realizada'?'ok':v.estado==='Cancelada'?'bad':v.estado==='Reprogramada'?'warn':'',est:v.estado})});

  for(const d in by)by[d].sort((a,b)=>(a.k==='t'?0:1)-(b.k==='t'?0:1));return by}

  ${l.slice(0,max).map(e=>`<div class="ev ${e.cls}" ${e.k==='v'?`data-calvis="${esc(e.id)}"`:`data-trip="${esc(e.id)}"`} title="${esc(e.t+' — '+e.sub)}">${esc(e.t)}<small>${esc(e.sub)}</small></div>`).join('')}

V.calendario=()=>{const mode=ui.calMode||'mes',ref=ui.calRef||today(),ev=calEvents();let title,days=[];
  if(mode==='mes'){const r=dOf(ref),first=dIso(new Date(r.getFullYear(),r.getMonth(),1)),last=new Date(r.getFullYear(),r.getMonth()+1,0);
    let d=monday(first);const end=dIso(new Date(last.getFullYear(),last.getMonth(),last.getDate()+(7-((last.getDay()+6)%7)-1)));

async function uploadFiles(cid,files,sec){if(!CAN()){toast('Tu usuario es solo de lectura');return}files=[...files];let ok=0;
  for(const [i,f] of files.entries()){if(f.size>52428800){toast(f.name+': supera los 50 MB');continue}
    toast(`Subiendo ${i+1} de ${files.length}: ${f.name}`);
    const safe=f.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w.\-]+/g,'_').slice(-80);
    const path=`${cid}/${Date.now().toString(36)}-${safe}`;
    const up=await sb.storage.from('adjuntos').upload(path,f,{contentType:f.type||'application/octet-stream'});
    if(up.error){toast('No se pudo subir '+f.name+': '+errTxt(up.error));continue}
    const {data,error}=await sb.from('adjuntos').insert({cliente_id:cid,seccion:sec||'General',nombre:f.name,path,tipo:f.type,tamano:f.size,subido_nombre:me()}).select().single();
    if(error){await sb.storage.from('adjuntos').remove([path]);toast('No se pudo registrar '+f.name+': '+errTxt(error));continue}

  if(ok)toast(ok===1?'Archivo subido':ok+' archivos subidos');if(cur&&cur.id===cid)redrawCli()}

async function importBackup(txt){let d;try{d=JSON.parse(txt)}catch(e){toast('El archivo no es un respaldo válido');return}
  const C=d.C||d.clientes||{},Vv=d.V||d.visitas||{},T=d.T||d.viajes||{};const rows=(o)=>Object.values(o).filter(x=>x&&x.id).map(x=>({id:x.id,data:x}));
  const n=[rows(C).length,rows(Vv).length,rows(T).length];if(!confirm(`Se van a cargar ${n[0]} clientes, ${n[1]} visitas y ${n[2]} viajes. Los que tengan el mismo código se reemplazan. ¿Continuar?`))return;
  for(const [tb,o] of [['clientes',C],['visitas',Vv],['viajes',T]]){const r=rows(o);for(let i=0;i<r.length;i+=200){const {error}=await sb.from(tb).upsert(r.slice(i,i+200));if(error){toast('Error importando '+tb+': '+errTxt(error));return}}}
  if(d.cfg){S.cfg={...S.cfg,...d.cfg};await putCfg()}
  for(const c of ['clientes','visitas','viajes'])await reloadCol(c);toast('Respaldo importado');render()}
document.addEventListener('change',async e=>{const t=e.target;
  if(t.id==='bkfile'&&t.files[0]){importBackup(await t.files[0].text());t.value=''}
  if(t.dataset&&t.dataset.unom){const v=t.value.trim();if(!v)return;const {error}=await sb.from('perfiles').update({nombre:v}).eq('id',t.dataset.unom);if(error)toast('No se pudo cambiar el nombre: '+errTxt(error));else{PERFILES[t.dataset.unom].nombre=v;if(t.dataset.unom===PERFIL.id){PERFIL.nombre=v;drawWho()}toast('Nombre actualizado')}}
  if(t.dataset&&t.dataset.urol){const {error}=await sb.from('perfiles').update({rol:t.value}).eq('id',t.dataset.urol);if(error)toast('No se pudo cambiar el rol: '+errTxt(error));else{PERFILES[t.dataset.urol].rol=t.value;toast('Rol actualizado')}}});
document.addEventListener('click',async e=>{const el=e.target.closest('[data-adjver],[data-adjdel],[data-logout],[data-mypwd],[data-unew],[data-uact],[data-upwd],[data-udel],[data-bkdown],[data-bkpaste]');if(!el)return;const d=el.dataset;
  if(d.adjver){openAdj(d.adjver);return}
  if(d.adjdel){if(el.dataset.sure)removeAdj(d.adjdel);else{el.dataset.sure=1;el.textContent='¿Seguro?'}return}
  if(d.logout!==undefined){await sb.auth.signOut();location.reload();return}
  if(d.mypwd!==undefined){authView('newpwd');return}
  if(d.bkpaste!==undefined){const v=$('#bkpaste').value.trim();if(!v){toast('Pegá primero el respaldo');return}importBackup(v);return}
  if(d.bkdown!==undefined){const blob=new Blob([JSON.stringify({fecha:new Date().toISOString(),C:S.C,V:S.V,T:S.T,cfg:S.cfg},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='minexo-respaldo-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);return}
  try{
    if(d.unew!==undefined){const b={accion:'crear',nombre:$('#un').value.trim(),email:$('#ue').value.trim(),password:$('#up').value,rol:$('#ur').value};
      if(!b.nombre||!b.email||b.password.length<8){toast('Completá nombre, email y una contraseña de al menos 8 caracteres');return}
      el.disabled=true;el.textContent='Creando…';await adminFn(b);await loadPerfiles();toast('Usuario creado: '+b.email);render();return}
    if(d.uact){const u=PERFILES[d.uact];const {error}=await sb.from('perfiles').update({activo:!u.activo}).eq('id',u.id);if(error)throw error;u.activo=!u.activo;toast(u.activo?'Usuario activado':'Usuario desactivado: ya no puede entrar');render();return}
    if(d.upwd){const pw=prompt('Nueva contraseña para '+PERFILES[d.upwd].nombre+' (mínimo 8 caracteres):');if(!pw)return;await adminFn({accion:'password',id:d.upwd,password:pw});toast('Contraseña actualizada');return}
    if(d.udel){if(!el.dataset.sure){el.dataset.sure=1;el.textContent='¿Seguro?';return}await adminFn({accion:'eliminar',id:d.udel});delete PERFILES[d.udel];toast('Usuario eliminado');render();return}
  }catch(err){toast(err.message||String(err));el.disabled=false;render()}});

/* ---------- arranque ---------- */
const AB=()=>$('#authBox'),LOGO='<div class="logo">MINE<span>X</span>O</div><div class="sub">Gestión comercial</div>';
function authView(v,msg,bad){$('#auth').hidden=false;const m=msg?`<div class="msg ${bad?'bad':''}">${esc(msg)}</div>`:'';
  if(v==='login')AB().innerHTML=LOGO+`<form id="fLogin"><label>Email<input type="email" id="le" autocomplete="username" required></label><label>Contraseña<input type="password" id="lp" autocomplete="current-password" required></label>${m}<button class="btn p">Ingresar</button></form><button class="lnk" data-av="forgot">Olvidé mi contraseña</button>`;
  if(v==='forgot')AB().innerHTML=LOGO+`<form id="fForgot"><p class="muted" style="font-size:14px">Te mandamos un email con un link para crear una contraseña nueva.</p><label>Email<input type="email" id="fe" required></label>${m}<button class="btn p">Enviar link</button></form><button class="lnk" data-av="login">Volver</button>`;
  if(v==='newpwd')AB().innerHTML=LOGO+`<form id="fPwd"><p class="muted" style="font-size:14px">Elegí tu nueva contraseña (mínimo 8 caracteres).</p><label>Nueva contraseña<input type="password" id="np" autocomplete="new-password" minlength="8" required></label><label>Repetila<input type="password" id="np2" autocomplete="new-password" minlength="8" required></label>${m}<button class="btn p">Guardar contraseña</button></form>${PERFIL?'<button class="lnk" data-av="close">Cancelar</button>':''}`;
  if(v==='off')AB().innerHTML=LOGO+`<div class="msg bad">${esc(msg)}</div><button class="btn" data-logout>Salir</button>`;
  if(v==='setup')AB().innerHTML=LOGO+`<div class="msg bad">Falta configurar la conexión con la base de datos: completá <b>config.js</b> con la URL y la clave pública de Supabase (ver guía, paso 3).</div>`;
  const f=AB().querySelector('input');if(f)f.focus()}
document.addEventListener('click',e=>{const a=e.target.closest('[data-av]');if(!a)return;if(a.dataset.av==='close')$('#auth').hidden=true;else authView(a.dataset.av)});
document.addEventListener('submit',async e=>{const f=e.target;if(!['fLogin','fForgot','fPwd'].includes(f.id))return;e.preventDefault();const b=f.querySelector('button');b.disabled=true;
  try{
    if(f.id==='fLogin'){const {error}=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});if(error)throw new Error(/invalid/i.test(error.message)?'Email o contraseña incorrectos':error.message);await start();return}
    if(f.id==='fForgot'){const {error}=await sb.auth.resetPasswordForEmail($('#fe').value.trim(),{redirectTo:location.origin+location.pathname});if(error)throw error;authView('login','Si el email está registrado, te llegó un link para crear una contraseña nueva. Revisá también spam.');return}
    if(f.id==='fPwd'){if($('#np').value!==$('#np2').value)throw new Error('Las contraseñas no coinciden');const {error}=await sb.auth.updateUser({password:$('#np').value});if(error)throw error;
      if(PERFIL){$('#auth').hidden=true;toast('Contraseña actualizada')}else await start();return}
  }catch(err){const v=f.id==='fLogin'?'login':f.id==='fForgot'?'forgot':'newpwd';authView(v,err.message||String(err),true)}});
async function loadPerfiles(){const {data}=await sb.from('perfiles').select('*');PERFILES={};(data||[]).forEach(p=>PERFILES[p.id]=p)}
let STARTED=false;
async function start(){const {data:{session}}=await sb.auth.getSession();if(!session){authView('login');return}
  const {data:p}=await sb.from('perfiles').select('*').eq('id',session.user.id).maybeSingle();
  if(!p){authView('off','Tu usuario no tiene perfil en el sistema. Pedile al administrador que te dé acceso.');return}
  if(!p.activo){authView('off','Tu usuario está desactivado. Pedile al administrador que lo active.');return}
  PERFIL=p;if(!V[route])route='panel';if(/access_token/.test(location.hash))history.replaceState(null,'',location.pathname+'#'+route);if(STARTED){$('#auth').hidden=true;render();return}STARTED=true;
  const sync=$('#sync');sync.textContent='Cargando datos…';
  try{
    const [cs,vs,ts,cf,ad]=await Promise.all([fetchAll('clientes','id,data'),fetchAll('visitas','id,data'),fetchAll('viajes','id,data'),sb.from('config').select('data').eq('id','main').maybeSingle(),fetchAll('adjuntos','*'),loadPerfiles()]);
    S.C={};cs.forEach(r=>S.C[r.id]=r.data);S.V={};vs.forEach(r=>S.V[r.id]=r.data);S.T={};ts.forEach(r=>S.T[r.id]=r.data);
    if(cf.data&&cf.data.data)S.cfg={...S.cfg,...cf.data.data};ADJ={};ad.forEach(adjAdd);
    sync.textContent='Sincronizado con el equipo'}catch(e){sync.textContent='Error al cargar: '+(e.message||e)}
  $('#auth').hidden=true;render();
  sb.channel('minexo').on('postgres_changes',{event:'*',schema:'public'},pl=>{const t=pl.table,n=pl.new,o=pl.old;
    if(COL[t]){const k=COL[t];if(pl.eventType==='DELETE')delete S[k][o.id];else S[k][n.id]=n.data}
    else if(t==='config'&&n&&n.id==='main')S.cfg={...S.cfg,...n.data};
    else if(t==='adjuntos'){if(pl.eventType==='DELETE')adjDel(o.id);else adjAdd(n)}
    else if(t==='perfiles'){if(pl.eventType==='DELETE')delete PERFILES[o.id];else{PERFILES[n.id]=n;if(n.id===PERFIL.id){PERFIL=n;if(!n.activo)location.reload()}}}
    if(!cur&&!curV)render();else if(cur&&t==='adjuntos'&&tab!=='ficha'&&tab!=='relev')redrawCli()})
  .subscribe(st=>{if(st==='SUBSCRIBED')sync.textContent='Sincronizado con el equipo';else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT')sync.textContent='Sin conexión en vivo: recargá la página para ver cambios de otros'})}
(async()=>{const cfg=window.MINEXO||{};
  if(!cfg.url||!cfg.key||/TU-PROYECTO|PEGAR/.test(cfg.url+cfg.key)||!window.supabase){authView('setup');return}
  sb=supabase.createClient(cfg.url.trim().replace(/\/(rest|auth|storage)\/v1\/?.*$/,'').replace(/\/+$/,''),cfg.key.trim());
  sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){setTimeout(()=>authView('newpwd','Ingresaste con el link del email. Creá tu contraseña nueva.'),50)}});
  if(/type=recovery/.test(location.hash)){route='panel';return}
  await start()})();

}
</script>
